<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Web API Chatbot</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="header-info">
                <i class="fa-solid fa-robot bot-icon"></i>
                <div>
                    <h2>Web API Assistant</h2>
                    <span class="status-indicator">Online</span>
                </div>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">
                Hello! I am connected directly to a live Web AI API. Ask me anything!
            </div>
        </div>

        <form class="chat-input-area" id="chatForm">
            <input type="text" id="userInput" placeholder="Type your message here..." autocomplete="off" required>
            <button type="submit" id="sendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
